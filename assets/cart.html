<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart</title>
  <style>
    body { font-family: -apple-system, Arial; padding: 16px; }
    .card { padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
    button { padding: 10px 14px; border-radius: 10px; border: none; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .total { font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <h2>HTML Shopping Cart</h2>
    <p>Demo for WebView JavaScript Integration</p>

    <div class="row">
      <span class="total">Total: $<span id="total">250</span></span>
      <button onclick="increase()">+50</button>
      <button onclick="decrease()">-25</button>
      <button onclick="sendTotalToFlutter()">Send total to Flutter</button>
    </div>

    <p id="log"></p>
  </div>

  <script>
    function getTotal() {
      return parseInt(document.getElementById('total').innerText, 10) || 0;
    }

    function setTotal(v) {
      document.getElementById('total').innerText = v;
      document.getElementById('log').innerText = 'Updated total = ' + v;
    }

    function increase() { setTotal(getTotal() + 50); }
    function decrease() { setTotal(Math.max(0, getTotal() - 25)); }

    // JS -> Flutter (channel name: FlutterChannel)
    function sendTotalToFlutter() {
      const total = getTotal();
      if (window.FlutterChannel && window.FlutterChannel.postMessage) {
        window.FlutterChannel.postMessage(String(total));
      } else {
        document.getElementById('log').innerText =
          'FlutterChannel not found (run inside Flutter WebView)';
      }
    }

    // Flutter -> JS
    function updateTotalFromFlutter(newTotal) {
      setTotal(parseInt(newTotal, 10) || 0);
    }
  </script>
</body>
</html>
